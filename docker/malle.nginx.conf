server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # add a strict CSP header
    add_header Content-Security-Policy "default-src 'self'; script-src https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; style-src https://cdnjs.cloudflare.com 'self' 'sha256-n1Ka7tYKSSn6Q706uoq7IDKKvBbp6Ni+ygmpVZgBcdg='";


    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
